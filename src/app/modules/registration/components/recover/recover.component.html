<section class="login__container">
  <p-card header="Восстановление пароля" class="login__card shadow-3">

    <div class="flex flex-column gap-3 align-items-center">

      <div  [formGroup]="recoverForm" class="flex flex-column">
        <div class="p-inputgroup mb-4">
          <span class="p-inputgroup-addon"><i class="pi pi-user"></i></span>
          <input type="text" formControlName="username" pInputText placeholder="email / номер телефона">
        </div>
        <ngx-recaptcha2 [siteKey]="siteKey" formControlName="recaptcha"></ngx-recaptcha2>


      </div>
    </div>
    <ng-template pTemplate="footer" >
      <div class="text-center flex flex-row gap-2">
        <p-button (onClick)="recover()" [disabled]="recoverForm.invalid" styleClass="p-button-success"  label="ВОССТАНОВИТЬ" icon="pi pi-check"></p-button>
        <p-button [routerLink]="['/login']" class="ml-auto"  styleClass="p-button-link" label="Войти"></p-button>
      </div>
    </ng-template>
  </p-card>
</section>
