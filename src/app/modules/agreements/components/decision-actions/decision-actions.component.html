<mat-toolbar class="actions">
  <button (click)="decline()" class="mr-auto" mat-raised-button color="warn">
    <mat-icon>thumb_down</mat-icon>Отклонить
  </button>
  <button (click)="editComment()"  mat-icon-button>
    <mat-icon matBadge="1" matBadgeColor="warn" [matBadgeHidden]="commentControl.invalid">comment</mat-icon>
  </button>
  <button (click)="approve()" class="ml-auto" mat-raised-button color="primary">
    <mat-icon>thumb_up</mat-icon>Принять
  </button>
</mat-toolbar>
