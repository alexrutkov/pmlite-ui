<ng-container *ngIf="(agreement$ | async) as agreement">
  <div class="container with-actions">
    @switch (agreement.type) {
      @case('TASK') {<app-agreement-task [agreement]="agreement"></app-agreement-task>}
      @case('TASK_USER') {<app-agreement-task [agreement]="agreement"></app-agreement-task>}
    }
  </div>
  <app-decision-actions [agreement]="agreement"></app-decision-actions>
</ng-container>
