
<div class="container">
	<mat-toolbar class="agreement justify-content-center">
		Участие команды в задаче
	</mat-toolbar>
	<mat-tab-group>
		<mat-tab label="Команда">
			<app-team-details [teamId]="details.teamId" />
		</mat-tab>
		<mat-tab label="Задача">
			<app-task-details [taskId]="details.taskId"/>
		</mat-tab>
		<mat-tab label="Деятель">
			<app-user-details [userId]="agreement.user.id"/>
		</mat-tab>
	</mat-tab-group>
</div>
