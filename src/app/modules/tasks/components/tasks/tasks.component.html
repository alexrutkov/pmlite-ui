<div class="flex flex-column gap-2">
  <mat-card *ngFor="let t of tasks$ | async">
    <mat-card-header>
      <mat-card-title>{{t.name}}</mat-card-title>
    </mat-card-header>
    <mat-card-content class="pt-3">
      {{t.description}}
    </mat-card-content>
    <mat-card-actions align="end">
      <button [routerLink]="[t.id]" class="mr-auto" mat-button><mat-icon>visibility</mat-icon> Просмотр</button>
      <button mat-button><mat-icon>group_work</mat-icon> В работу</button>
      <button color="primary" mat-icon-button><mat-icon>add_alert</mat-icon></button>
    </mat-card-actions>
    <mat-card-footer class="pr-2 pb-2 text-bluegray-300 text-sm flex">
      <span class="ml-auto">{{t.createdAt | date: 'short'}}</span>
    </mat-card-footer>
  </mat-card>
</div>
