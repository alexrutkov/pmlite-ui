
<div *ngIf="task$ | async as task">
  <h2 class="flex flex-column">
    <span>{{task.name}}</span>
    <span class="text-bluegray-300 text-sm ml-auto">{{task.createdAt | date: 'short'}}</span>
  </h2>
  <p>{{task.description}}</p>
  <div class="flex flex-column gap-1">
    <h4>Сроки</h4>
    <span>Начало: {{task.startDate | date: 'shortDate'}}</span>
    <span>Окончание: {{task.finishDate | date: 'shortDate'}}</span>
  </div>

</div>
