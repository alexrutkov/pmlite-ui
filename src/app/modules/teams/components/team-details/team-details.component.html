<div *ngIf="(team$ | async) as team" class="flex flex-column gap-2 w-full pt-3">
	<div class="flex flex-row align-items-center">
		<div class="flex-column flex gap-1 align-items-center flex-grow-1">
			<span>Команда №{{team.summary.id}}</span>
			<strong>{{team.summary.name}}</strong>
		</div>
		<app-team-menu class="flex-shrink-0" [teamId]="team.summary.id"/>

	</div>

	<p style="text-indent: 30px">{{team.summary.description}}</p>
	<app-tags [tags]="team.tags"/>
	<mat-accordion class="w-full">
		<mat-expansion-panel>
			<mat-expansion-panel-header>
				<mat-panel-title>
					Участники
				</mat-panel-title>
			</mat-expansion-panel-header>
			<ng-template matExpansionPanelContent>
				<app-team-users [teamId]="team.summary.id"/>
			</ng-template>
		</mat-expansion-panel>
	</mat-accordion>
</div>
