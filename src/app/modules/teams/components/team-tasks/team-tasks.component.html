<cdk-virtual-scroll-viewport *ngIf="(task$ | async) as tasks" itemSize="190"
														 [style.height.px]="190 * (tasks.length > 4 ? 4 : tasks.length) + 10">
	<app-team-task-details
		*cdkVirtualFor="let t of tasks; trackBy: teamUsersStore.trackIdFn"
		[teamTask]="t"/>
</cdk-virtual-scroll-viewport>
