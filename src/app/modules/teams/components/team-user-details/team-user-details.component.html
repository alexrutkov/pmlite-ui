<mat-card class="user mat-elevation-z4">
	<mat-card-header>
		<mat-card-title>{{teamUser.user.name}}</mat-card-title>
		<mat-card-subtitle>{{ teamUser.role }}</mat-card-subtitle>
		<app-avatar [userId]="teamUser.user.id" mat-card-avatar ></app-avatar>


	</mat-card-header>
	<mat-card-actions>
		<button [routerLink]="['/users', teamUser.user.id]" mat-button><mat-icon>visibility</mat-icon> Просмотр</button>
		<button [matMenuTriggerFor]="menu" *ngIf="manager.canManageTeamUser(teamUser) | async" class="ml-auto" mat-icon-button>
			<mat-icon>settings</mat-icon>
		</button>
	</mat-card-actions>
	<mat-card-footer class="pr-2 pb-2 text-bluegray-300 text-sm flex">
		<span class="ml-auto">{{ teamUser.createdAt | date: 'short' }}</span>
	</mat-card-footer>
</mat-card>


<mat-menu #menu="matMenu">
	<button [disabled]="!(manager.canCancelTeamUser(teamUser) | async)"
					(click)="manager.cancelUser(teamUser)" mat-menu-item>
		<mat-icon>cancel</mat-icon>
		<span>Отклонить деятеля</span>
	</button>
</mat-menu>
