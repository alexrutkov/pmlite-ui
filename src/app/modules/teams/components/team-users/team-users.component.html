<cdk-virtual-scroll-viewport *ngIf="(users$ | async) as users" itemSize="190"
														 [style.height.px]="190 * (users.length > 4 ? 4 : users.length) + 10">
	<app-team-user-details
		*cdkVirtualFor="let u of users; trackBy: teamUsersStore.trackIdFn"
		[teamUser]="u"></app-team-user-details>
</cdk-virtual-scroll-viewport>
