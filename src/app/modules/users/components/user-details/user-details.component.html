<div
  *ngIf="(user$ | async) as user"
  class="flex flex-column gap-2 w-full align-items-center">
  <div>
    <img *defaultAvatar="user.details.id; url as u" [src]="u" width="200" height="200"  alt="">
  </div>
  <div class="flex-column flex gap-1">
    <strong>{{ user.details.name }}</strong>
    <span>&#64;id{{ user.details.id }}</span>
  </div>
  <p style="text-indent: 30px">{{user.details.description}}</p>
	<app-tags [tags]="user.tags"></app-tags>

  <mat-accordion class="w-full">
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Задачи</mat-panel-title>
      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent><app-user-tasks [userId]="user.details.id"/></ng-template>
    </mat-expansion-panel>
		<mat-expansion-panel>
			<mat-expansion-panel-header>
				<mat-panel-title>Команды</mat-panel-title>
			</mat-expansion-panel-header>
			<ng-template matExpansionPanelContent><app-user-teams [userId]="user.details.id"/></ng-template>
		</mat-expansion-panel>
  </mat-accordion>
</div>
