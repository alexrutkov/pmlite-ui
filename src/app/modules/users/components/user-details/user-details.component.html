<div
  *ngIf="(user$ | async) as user"
  class="flex flex-column gap-2 w-full align-items-center">
  <div>
    <img ngSrc="https://via.placeholder.com/200x200" width="200" height="200"  alt="">
  </div>
  <div class="flex-column flex gap-1">
    <strong>{{ user.name }}</strong>
    <span>&#64;id{{ user.id }}</span>
  </div>
  <p style="text-indent: 30px">{{user.description}}</p>
  <mat-chip-set>
    <mat-chip>Скульптура</mat-chip>
    <mat-chip>Физика</mat-chip>
  </mat-chip-set>

</div>
<mat-accordion>
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title>
        Команды
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <ol>
        <li><a [routerLink]="['/teams', '1']">Творческая команда</a></li>
        <li><a [routerLink]="['/teams', '1']">Обычная команда</a></li>
      </ol>
    </ng-template>

  </mat-expansion-panel>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        Задачи
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <mat-card class="user mat-elevation-z4">
        <mat-card-header>
          <mat-card-title>{{ 'Название' | titlecase }}</mat-card-title>
          <mat-card-subtitle>Роль</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>

        </mat-card-content>
        <mat-card-actions>
          <button   mat-button><mat-icon>visibility</mat-icon> Просмотр</button>
          <button  class="ml-auto" mat-icon-button><mat-icon>more_vert</mat-icon></button>
        </mat-card-actions>
        <mat-card-footer class="pr-2 pb-2 text-bluegray-300 text-sm flex">
          <span class="ml-auto">sdfgdfg</span>
        </mat-card-footer>
      </mat-card>
      <ol>
        <li>


        </li>
        <li><a [routerLink]="['/tasks', '991c97dd-9a80-4669-986c-117d8d116c0f']">Моя первая задача</a></li>
      </ol>
    </ng-template>

  </mat-expansion-panel>

</mat-accordion>

<section>
  <h3>Согласования</h3>
  <ul class="flex flex-column gap-2">
    <li *ngFor="let e of events"><app-agreement-short-details [agreement]="e"></app-agreement-short-details></li>
  </ul>

</section>
