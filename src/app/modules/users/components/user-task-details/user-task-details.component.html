<mat-card class="task mat-elevation-z4">
  <mat-card-header>
    <mat-card-title>{{task.name}}</mat-card-title>
    <mat-card-subtitle>{{ task.role }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions>
    <button [routerLink]="['/tasks', task.id]"  mat-button><mat-icon>visibility</mat-icon> Просмотр</button>
    <button [matMenuTriggerFor]="menu" *ngIf="accountStore.canManageTask(task) | async" class="ml-auto" mat-icon-button>
      <mat-icon>settings</mat-icon>
    </button>
  </mat-card-actions>
  <mat-card-footer class="pr-2 pb-2 text-bluegray-300 text-sm flex">
    <span class="ml-auto">{{ task.createdAt | date: 'short' }}</span>
  </mat-card-footer>
</mat-card>


<mat-menu #menu="matMenu">
  <button [disabled]="!(accountStore.canCancelTask(task) | async)"
    (click)="cancelTask(task)"      mat-menu-item>
    <mat-icon>cancel</mat-icon>
    <span>Отменить выполнение</span>
  </button>
</mat-menu>
