<mat-card class="user mat-elevation-z4">
  <mat-card-header>
    <mat-card-title>{{ user.name | titlecase }}</mat-card-title>
    <mat-card-subtitle>&#64;id{{ user.id }}</mat-card-subtitle>
    <img mat-card-avatar defaultAvatar [src]="'/api/users/' + user.id + '/avatar.jpg'" alt="Photo Avatar">
  </mat-card-header>
  <mat-card-content>
    {{ user.description }}

<!--    <mat-chip-set>
      <mat-chip>Скульптура</mat-chip>
      <mat-chip>Физика</mat-chip>
    </mat-chip-set>-->
  </mat-card-content>
  <mat-card-actions>
    <div>
      <button mat-button><mat-icon color="warn">favorite</mat-icon> {{4212 | shortNumber }}</button>
      <button mat-button><mat-icon color="warn">star</mat-icon> {{251233 | shortNumber }}</button>
    </div>
    <button [routerLink]="['/users', user.id]" class="ml-auto" mat-button><mat-icon>visibility</mat-icon> Просмотр</button>
  </mat-card-actions>
  <mat-card-footer class="pr-2 pb-2 text-bluegray-300 text-sm flex">
    <span class="ml-auto">{{user.createdAt | date: 'short'}}</span>
  </mat-card-footer>
</mat-card>
