<mat-toolbar color="primary">
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>{{drawer.opened ? 'menu_open' : 'menu'}}</mat-icon>
  </button>
  <span class="ml-3">PM (lite)</span>
  <button class="ml-auto" [routerLink]="['/tasks', 'create']" mat-raised-button color="accent">
    <mat-icon>add_task</mat-icon> Создать задачу
  </button>
  <button class="ml-2"  mat-icon-button>
    <mat-icon>account_circle</mat-icon>
  </button>
</mat-toolbar>
<mat-drawer-container>
  <mat-drawer #drawer [mode]="'over'">
    <app-menu (route)="drawer.close()"></app-menu>
  </mat-drawer>
  <mat-drawer-content class="p-2">
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
