<div>
  <mat-nav-list>
    <a mat-list-item  (click)="navigate(['/'])">
      <div class="flex flex-row align-items-center gap-2">
        <mat-icon>task_alt</mat-icon><span>Задачи</span>
      </div>
    </a>
    <a mat-list-item (click)="navigate(['/employers'])" >
      <div class="flex flex-row align-items-center gap-2">
        <mat-icon>person</mat-icon><span>Деятели</span>
      </div>
    </a>
    <a mat-list-item (click)="navigate(['/teams'])" >
      <div class="flex flex-row align-items-center gap-2">
        <mat-icon>groups</mat-icon><span>Команды</span>
      </div>
    </a>
  </mat-nav-list>
  <mat-accordion>
    <mat-expansion-panel>
      <mat-expansion-panel-header style="background: beige;">
        <mat-panel-title style="font-size: 18px;">
          <mat-icon class="mr-2">handshake</mat-icon>Согласования
        </mat-panel-title>
        </mat-expansion-panel-header>

      <ng-template matExpansionPanelContent>
        <mat-nav-list>
          <a mat-list-item (click)="navigate(['/tags'])" >
            <div class="flex flex-row align-items-center gap-2"><mat-icon>tag</mat-icon><span>Создание тегов</span></div>
          </a>
          <a mat-list-item (click)="navigate(['/tags'])" >
            <div class="flex flex-row align-items-center gap-2"><mat-icon>add_task</mat-icon><span>Создание задач</span></div>
          </a>
          <a mat-list-item (click)="navigate(['/tags'])" >
            <div class="flex flex-row align-items-center gap-2"><mat-icon>group_add</mat-icon><span>Участие в командах</span></div>
          </a>
          <a mat-list-item (click)="navigate(['/tags'])" >
            <div class="flex flex-row align-items-center gap-2"><mat-icon>task</mat-icon><span>Участие в задачах</span></div>
          </a>
          <a mat-list-item (click)="navigate(['/tags'])" >
            <div class="flex flex-row align-items-center gap-2"><mat-icon>history</mat-icon><span>История</span></div>
          </a>
        </mat-nav-list>
      </ng-template>
    </mat-expansion-panel>
  </mat-accordion>
</div>
